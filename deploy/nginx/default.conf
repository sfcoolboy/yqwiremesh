server {
    listen 80;
    server_name www.yqwiremesh.com yqwiremesh.com;

    return 301 https://www.yqwiremesh.com$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.yqwiremesh.com yqwiremesh.com;

    ssl_certificate     /etc/nginx/certs/www.yqwiremesh.com.crt;
    ssl_certificate_key /etc/nginx/certs/www.yqwiremesh.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ---- Cloudflare real_ip (取消注释后生效) ----
    #set_real_ip_from  173.245.48.0/20;
    #set_real_ip_from  103.21.244.0/22;
    #set_real_ip_from  103.22.200.0/22;
    #set_real_ip_from  103.31.4.0/22;
    #set_real_ip_from  141.101.64.0/18;
    #set_real_ip_from  108.162.192.0/18;
    #set_real_ip_from  190.93.240.0/20;
    #set_real_ip_from  188.114.96.0/20;
    #set_real_ip_from  197.234.240.0/22;
    #set_real_ip_from  198.41.128.0/17;
    #set_real_ip_from  104.16.0.0/12;
    #set_real_ip_from  172.64.0.0/13;
    #set_real_ip_from  131.0.72.0/22;
    #set_real_ip_from  2400:cb00::/32;
    #set_real_ip_from  2606:4700::/32;
    #set_real_ip_from  2803:f800::/32;
    #set_real_ip_from  2405:b500::/32;
    #set_real_ip_from  2405:8100::/32;
    #set_real_ip_from  1a02:1280::/32;
    #set_real_ip_from  2a06:98c0::/29;
    #real_ip_header     X-Forwarded-For;
    #real_ip_recursive  on;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 256;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        alias /var/lib/yqmetals/uploads/;
        expires 1h;
        add_header Cache-Control "public";
    }

    location = /actuator/health {
        proxy_pass http://127.0.0.1:8082/actuator/health;
        proxy_set_header Host $host;
        access_log off;
    }
}