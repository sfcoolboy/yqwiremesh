spring:
  application:
    name: yqmetals-backend
  datasource:
    url: ${YQ_DB_URL:jdbc:mysql://localhost:3306/yqmetals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${YQ_DB_USERNAME:root}
    password: ${YQ_DB_PASSWORD}
    require_secure_transport: false
    driver-class-name: com.mysql.cj.jdbc.Driver
  mail: {}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 12MB
  sql:
    init:
      mode: never
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
server:
  port: 8082
app:
  base-url: ${BASE_URL:https://www.yqwiremesh.com}
  jwt:
    secret: ${YQ_JWT_SECRET}
    expiration-ms: 86400000
  cors:
    # 逗号分隔字符串：SecurityConfig 用 @Value 注入 List，YAML 列表写法读不到会回退默认值
    allowed-origins: http://localhost:5173,http://localhost:3000
  upload:
    dir: ${YQ_UPLOAD_DIR:./uploads}
