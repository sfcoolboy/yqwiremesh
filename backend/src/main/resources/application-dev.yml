spring:
  datasource:
    username: ${YQ_DB_USERNAME:root}
    password: ${YQ_DB_PASSWORD:Root@123456}
    url: jdbc:mysql://localhost:3306/yqmetals?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
app:
  base-url: http://localhost:5173
  jwt:
    # 必须是合法 Base64（JwtUtils 用 Base64 解码生成签名密钥）
    secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    expiration-ms: 86400000
  cors:
    # 逗号分隔字符串：SecurityConfig 用 @Value 注入 List
    allowed-origins: http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173
  upload:
    dir: ./uploads-dev
logging:
  level:
    com.yqmetals: debug
